<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Easy Math · Matematika SMP</title>
  <meta name="description" content="Materi matematika SMP kelas 7 dan 8 dalam bentuk animasi bercerita, lengkap dengan soal latihan dan pembahasan. Bisa dipakai offline.">
  <meta name="theme-color" content="#F3EEE3">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Easy Math">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="./fonts/nunito-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/app.css">
  <script>
    // Terapkan tema tersimpan sebelum halaman tergambar, supaya tidak berkedip.
    try {
      var s = JSON.parse(localStorage.getItem('easymath.k7.v1') || '{}');
      var t = s.settings && s.settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><div class="boot">Memuat materi…</div></div>
  <noscript><div class="state-box"><p class="state-title">JavaScript perlu dinyalakan.</p><p>Animasi dan soal latihan di Easy Math berjalan dengan JavaScript. Nyalakan di pengaturan browser, lalu muat ulang halaman ini.</p></div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
